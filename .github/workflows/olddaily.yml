name: Daily Belle — build and publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "data/editions/**.json"
      - "templates/**"
      - "static/**"
      - "scripts/render_site.py"
      - "build_config.json"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build today's edition (skipped on manual template/style pushes)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python scripts/build_edition.py

      - name: Commit new edition, if any
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "daily-belle-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/editions/
          if ! git diff --cached --quiet; then
            git commit -m "Add edition $(date -u +%Y-%m-%d)"
            git push
          else
            echo "No new edition file to commit."
          fi

      - name: Render site
        run: python scripts/render_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
